# Local Postgres for development and tests. Port 5433 so it does not
# collide with a Postgres you may already run on 5432.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: lvtd-dev
      POSTGRES_DB: lvtd-dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
  # Optional Qdrant for the `qdrant` Cargo feature; only starts with
  # `docker compose --profile qdrant up -d`. REST on 6333, gRPC on 6334.
  qdrant:
    image: qdrant/qdrant:v1.19.2
    profiles: ["qdrant"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant:/qdrant/storage

volumes:
  pgdata:
  qdrant:
