[package]
name = "auth"
description = "Users, passwords and cookie sessions for LVTD apps."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# A software authenticator for tests; never enable it in a release build.
test-support = []

[dependencies]
app-core.workspace = true

anyhow.workspace = true
argon2.workspace = true
axum.workspace = true
# Already in the tree through rustls; verifies passkey signatures without OpenSSL.
ring = "0.17"
# Renders the TOTP enrolment QR code; no default features, so no image stack.
qrcode = { version = "0.14", default-features = false }
base64 = "0.23"
getrandom.workspace = true
serde.workspace = true
serde_json = "1"
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
# Redirect URI checks and form bodies for the OAuth server; both already in the tree through reqwest.
url = "2"
form_urlencoded = "1"

[dev-dependencies]
http-body-util.workspace = true
