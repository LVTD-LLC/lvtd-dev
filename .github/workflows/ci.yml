name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
    inputs:
      full_mutation:
        description: Audit all Rust code instead of the last commit (can take hours)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Known vulnerabilities, unmaintained crates, licenses and sources (deny.toml).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    timeout-minutes: 180
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: lvtd-dev
          POSTGRES_DB: lvtd-dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:lvtd-dev@localhost:5432/lvtd-dev
      CARGO_TERM_COLOR: always
      # The capability matrix otherwise accumulates multi-GB debug/incremental artifacts.
      # Production release profiles and the complete test matrix stay unchanged.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: lean-ci-v1
      - run: cargo install sqlx-cli --no-default-features --features postgres,rustls --locked
      - run: cargo sqlx migrate run
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Fails if .sqlx is stale: regenerate with `cargo sqlx prepare --workspace`.
      - run: cargo sqlx prepare --workspace --check -- --all-features --all-targets
      - run: cargo test --workspace
      - run: python3 scripts/ci/test-mutation-test.py
      - name: Install mutation tester
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Mutation test changed Rust code
        env:
          FULL_MUTATION: ${{ inputs.full_mutation || false }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base=$PR_BASE ;;
            push) base=$PUSH_BEFORE ;;
            *) base=$(git rev-parse --verify HEAD^ 2>/dev/null || git rev-parse HEAD) ;;
          esac
          # A new repository has no previous push to compare against. Normal
          # tests establish its baseline; full historical audits are explicit.
          if [[ "$base" =~ ^0+$ ]]; then
            echo "Initial push: no changed-code mutation baseline yet."
            base=$(git rev-parse HEAD)
          fi
          if [ "$FULL_MUTATION" = true ]; then base=; fi
          bash scripts/ci/mutation-test.sh "$base"
      - name: Save mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-project
          path: mutants.out
          include-hidden-files: true
          retention-days: 14
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - run: cargo test --workspace --no-default-features
      - run: cargo clippy --workspace --all-targets --no-default-features --features blog -- -D warnings
      - run: cargo test --workspace --no-default-features --features blog
      - run: cargo clippy --workspace --all-targets --no-default-features --features docs -- -D warnings
      - run: cargo test --workspace --no-default-features --features docs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test app/tests/*.test.cjs
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: SQLX_OFFLINE=true cargo check --workspace --all-targets --all-features
      - name: Check independent optional capabilities
        run: |
          for feature in auth google github stripe storage qdrant sentry-errors sentry-traces sentry-logs sentry-metrics sentry-replay posthog-web posthog-product posthog-logs posthog-traces; do
            cargo clippy --workspace --all-targets --no-default-features --features "$feature" -- -D warnings
            cargo test --workspace --no-default-features --features "$feature"
            SQLX_OFFLINE=true cargo check --workspace --all-targets --no-default-features --features "$feature"
          done
      - run: cargo build --release --locked -p lvtd-dev

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fuzz -> target"
          key: fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny --manifest-path fuzz/Cargo.toml --config deny.toml check
      - run: bash scripts/fuzz.sh 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fuzz-${{ github.run_id }}
          path: |
            fuzz/artifacts/
            fuzz/corpus/
          if-no-files-found: ignore

  # Runs for every generated project, with its selected Cargo defaults.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: lvtd-dev
          POSTGRES_DB: lvtd-dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:lvtd-dev@localhost:5432/lvtd-dev
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-01
          components: llvm-tools-preview, rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: python3 -m unittest discover -s scripts -p 'test_coverage_*.py'
      - run: bash scripts/coverage.sh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/branch-coverage
      - uses: actions/upload-artifact@v7
        with:
          name: branch-coverage
          path: target/coverage/
          if-no-files-found: error
          retention-days: 14
